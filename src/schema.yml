version: 2

sources:
  - name: oulad_raw
    description: "Raw Open University Learning Analytics Dataset (OULAD) loaded from CSV files into Databricks."
    tables:
      - name: courses
        description: "Contains list of course modules, presentations (B=Feb, J=Oct), and presentation length in days."
      - name: assessments
        description: "Information about course assessments, final submission dates, and assessment weights."
      - name: vle
        description: "Metadata for Virtual Learning Environment (VLE) materials, associated roles, and target weeks."
      - name: studentInfo
        description: "Student demographics, geographic region, education level, disability status, and final outcomes."
      - name: studentRegistration
        description: "Student course registration and unregistration date offsets (in days relative to presentation start)."
      - name: studentAssessment
        description: "Student assessment submissions, submission offsets, banked flags, and scores (0-100)."
      - name: studentVle
        description: "Daily interaction logs tracking student clicks on specific VLE materials."

models:
  # ---------------------------------------------------------------------------
  # 01_BRONZE LAYER 
  # ---------------------------------------------------------------------------
  - name: courses_bronze
    description: "Bronze view for raw courses. Contains code_module, code_presentation, and presentation length in days."
    columns:
      - name: code_module
        description: "Code name of the module, serving as an identifier."
        tests: [not_null]
      - name: code_presentation
        description: "Code name of the presentation (e.g., year + 'B' for Feb or 'J' for Oct)."
        tests: [not_null]
      - name: length
        description: "Length of the module-presentation in days."

  - name: assessments_bronze
    description: "Bronze view for raw course assessment definitions and weights."
    columns:
      - name: code_module
        description: "Identification code of the module."
        tests: [not_null]
      - name: code_presentation
        description: "Identification code of the presentation."
        tests: [not_null]
      - name: id_assessment
        description: "Identification number of the assessment."
        tests: [unique, not_null]
      - name: assessment_type
        description: "Type of assessment (e.g., TMA, CMA, Exam)."
      - name: date
        description: "Final submission date calculated as days relative to start (start date = 0)."
      - name: weight
        description: "Weight of assessment in %. Exams are typically 100%; other assessments sum to 100%."

  - name: vle_bronze
    description: "Bronze view for raw Virtual Learning Environment (VLE) material metadata."
    columns:
      - name: id_site
        description: "Identification number of the material."
        tests: [unique, not_null]
      - name: code_module
        description: "Identification code for the module."
      - name: code_presentation
        description: "Identification code of the presentation."
      - name: activity_type
        description: "Role associated with the module material."
      - name: week_from
        description: "Week from which the material is planned to be used."
      - name: week_to
        description: "Week until which the material is planned to be used."

  - name: student_info_bronze
    description: "Bronze view for raw student demographic information and final results."
    columns:
      - name: code_module
        description: "Module code on which the student registered."
        tests: [not_null]
      - name: code_presentation
        description: "Presentation code during which the student registered."
        tests: [not_null]
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]
      - name: gender
        description: "Student's gender."
      - name: region
        description: "Geographic region where student lived during module presentation."
      - name: highest_education
        description: "Highest student education level on entry."
      - name: imd_band
        description: "Index of Multiple Deprivation band."
      - name: age_band
        description: "Band of the student's age."
      - name: num_of_prev_attempts
        description: "Number of times student has attempted this module."
      - name: studied_credits
        description: "Total number of credits currently being studied."
      - name: disability
        description: "Indicates whether student declared a disability."
      - name: final_result
        description: "Student's final result (Distinction, Pass, Fail, Withdrawn)."
        tests:
          - accepted_values:
              values: ['Distinction', 'Pass', 'Fail', 'Withdrawn']

  - name: student_registration_bronze
    description: "Bronze view for raw student registration and unregistration timeline logs."
    columns:
      - name: code_module
        description: "Identification code for a module."
        tests: [not_null]
      - name: code_presentation
        description: "Identification code of the presentation."
        tests: [not_null]
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]
      - name: date_registration
        description: "Registration date measured relative to presentation start (e.g., -30 means 30 days prior)."
      - name: date_unregistration
        description: "Unregistration date relative to presentation start (empty for completing students)."

  - name: student_assessment_bronze
    description: "Bronze view for raw student assessment submission entries and scores."
    columns:
      - name: id_assessment
        description: "Identification number of the assessment."
        tests: [not_null]
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]
      - name: date_submitted
        description: "Submission date measured in days relative to module start."
      - name: is_banked
        description: "Status flag indicating if result was transferred from a previous presentation."
      - name: score
        description: "Student score (0 to 100). Scores lower than 40 indicate Fail."

  - name: student_vle_bronze
    description: "Bronze view for raw daily student interaction logs with VLE resources."
    columns:
      - name: code_module
        description: "Identification code for a module."
      - name: code_presentation
        description: "Identification code of the module presentation."
      - name: id_student
        description: "Unique identification number for the student."
      - name: id_site
        description: "Identification number for the VLE material."
      - name: date
        description: "Interaction date measured in days relative to module start."
      - name: sum_click
        description: "Number of times student interacted with material on that date."

  # ---------------------------------------------------------------------------
  # 02_SILVER LAYER 
  # ---------------------------------------------------------------------------
  - name: courses_clean
    description: "Cleaned course metadata containing validated module codes, presentation windows, and duration in days."
    columns:
      - name: code_module
        description: "Cleaned identification code for the module."
        tests: [not_null]
      - name: code_presentation
        description: "Cleaned identification code for the presentation."
        tests: [not_null]
      - name: length
        description: "Length of module-presentation in days."

  - name: assessments_clean
    description: "Cleaned assessment structure with casting, standardized type names, and validated weight thresholds."
    columns:
      - name: id_assessment
        description: "Unique identification number for the assessment."
        tests: [unique, not_null]
      - name: weight
        description: "Assessment weight percentage (Exams = 100%, others sum to 100%)."

  - name: vle_clean
    description: "Cleaned VLE materials dataset with normalized activity roles and structured week ranges."
    columns:
      - name: id_site
        description: "Unique identification number for the material."
        tests: [unique, not_null]

  - name: student_info_clean
    description: "Cleaned student demographic profile, normalized education levels, IMD bands, and validated final outcomes."
    columns:
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]
      - name: final_result
        description: "Validated outcome: Distinction (3024), Pass (12361), Fail (7052), or Withdrawn (10156)."
        tests:
          - accepted_values:
              values: ['Distinction', 'Pass', 'Fail', 'Withdrawn']

  - name: student_registration_clean
    description: "Cleaned course registration dates and unregistration indicators (maps empty unregistration dates to completed status)."
    columns:
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]

  - name: student_assessment_clean
    description: "Cleaned student scores (0-100), calculated fail flags (score < 40), and submission delay offsets."
    columns:
      - name: id_assessment
        description: "Identification number for the assessment."
        tests: [not_null]
      - name: id_student
        description: "Unique identification number for the student."
        tests: [not_null]

  - name: student_vle_clean
    description: "Cleaned daily VLE interactions with aggregated click counts per student and material."
    columns:
      - name: id_site
        description: "Identification number for the VLE material."
      - name: sum_click
        description: "Total interaction clicks recorded on that date."

  # ---------------------------------------------------------------------------
  # 03_GOLD LAYER 
  # ---------------------------------------------------------------------------
  - name: dim_student_info
    description: "Gold dimension table combining student demographics, background information, and registration status."
    columns:
      - name: student_course_key
        description: "Composite key combining student ID, module code, and presentation code."
        tests: [unique, not_null]

  - name: dim_course_assessment
    description: "Gold dimension table combining course presentation metadata and assessment details."
    columns:
      - name: id_assessment
        description: "Unique identifier for each assessment."
        tests: [unique, not_null]

  - name: dim_vle
    description: "Gold dimension table for Virtual Learning Environment (VLE) course materials."
    columns:
      - name: id_site
        description: "Unique identifier for each VLE resource."
        tests: [unique, not_null]

  - name: module_presentation_fact_table
    description: "Gold fact table capturing aggregated performance, engagement, and completion metrics at the module-presentation level."

  - name: student_info_fact_table
    description: "Gold fact table tracking student activity, total assessment scores, VLE engagement metrics, and final course outcomes."
    columns:
      - name: id_student
        description: "Unique student identifier."
        tests: [not_null]
