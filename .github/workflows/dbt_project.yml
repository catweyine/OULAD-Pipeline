name: 'oulad_pipeline'
version: '1.0.0'
config-version: 2

profile: 'databricks_profile'

# Tell dbt to look in your existing src/ directory
model-paths: ["src"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  oulad_pipeline:
    # Map configurations directly to your current subfolders
    01_bronze:
      +materialized: view
    02_silver:
      +materialized: table
    03_gold:
      +materialized: table
