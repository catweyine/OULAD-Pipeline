name: dbt Full Pipeline (Test, Deploy & Docs)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  dbt-pipeline:
    name: Test, Deploy & Document Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks

      # 1. Integration & Schema Testing
      - name: Test Connections & Source Quality
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          dbt debug --profiles-dir .
          dbt test --select source:* --profiles-dir .

      # 2. Pipeline Deployment (Build Bronze, Silver, Gold)
      - name: Deploy Models to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          dbt run --profiles-dir .

      # 3. Post-Deployment Data Validation
      - name: Run Data Quality Tests on Transformed Tables
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          dbt test --select mode:transformed --profiles-dir .

      # 4. Auto-generate Interactive Lineage & Docs
      - name: Generate dbt Documentation
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          dbt docs generate --profiles-dir .

      # 5. Store Documentation Site as a CI Artifact
      - name: Upload Docs Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-site
          path: target/
