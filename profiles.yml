oulad_pipeline:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: main  # <--- Add your Unity Catalog name here (e.g., main)
      schema: oulad_gold
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      auth_type: token
      threads: 4
